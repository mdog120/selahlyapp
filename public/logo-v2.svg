<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Clean coquette bow/flower vector representation -->
  <!-- Left Loop -->
  <path d="M 50 45 C 30 15, 10 30, 25 50 C 35 60, 48 50, 50 45 Z" fill="url(#bow-grad-fav)" stroke="#D4A5A5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Loop -->
  <path d="M 50 45 C 70 15, 90 30, 75 50 C 65 60, 52 50, 50 45 Z" fill="url(#bow-grad-fav)" stroke="#D4A5A5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Left Ribbon Tail -->
  <path d="M 46 47 C 38 60, 20 75, 25 85 C 27 88, 33 83, 38 78 C 43 73, 46 62, 46 47" fill="none" stroke="#D4A5A5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right Ribbon Tail -->
  <path d="M 54 47 C 62 60, 80 75, 75 85 C 73 88, 67 83, 62 78 C 57 73, 54 62, 54 47" fill="none" stroke="#D4A5A5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Center Knot -->
  <circle cx="50" cy="46" r="5" fill="#D4A5A5" stroke="#D4A5A5" stroke-width="3"/>
  
  <defs>
    <linearGradient id="bow-grad-fav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#FFF0F0" />
      <stop offset="100%" stopColor="#F5D0D0" />
    </linearGradient>
  </defs>
</svg>
